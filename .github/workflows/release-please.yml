name: Release Please

# Keeps a release PR open against main, tracking every Conventional Commit
# since the last tag. Merging that PR bumps .release-please-manifest.json and
# stamps CHANGELOG.md — it does NOT tag. Tagging is auto-tag.yml's job (see
# `skip-github-release` in release-please-config.json), and the tag is what
# fires release.yml. Splitting it this way leaves the GoReleaser pipeline
# completely untouched: it still owns the GitHub Release and the cask.
on:
  push:
    branches: [main]

# Deny by default. Every write goes through the App token below, so
# GITHUB_TOKEN needs nothing. Granting it `contents: write` plus
# `pull-requests: write` would leave an unused merge-capable token in the job
# (cadence-ecosystem ADR-0044, security review N-3).
permissions: {}

# Serialize. Two runs racing would fight over the same release PR branch.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Maintain release PR
    runs-on: ubuntu-latest
    # RELEASE_APP_PRIVATE_KEY belongs only in the `release` environment, with
    # a deployment policy of branch `main` plus tag `v*` and no repo-level
    # copy. With that in place, and the `v*` tag ruleset limiting who can
    # create a tag, a copy of this workflow on another ref cannot read the
    # key (cadence-ecosystem ADR-0044 (i)).
    environment: release
    steps:
      # An App token, not GITHUB_TOKEN. This is NOT about token scope. It is
      # the repository policy "Allow GitHub Actions to create and approve pull
      # requests" (`can_approve_pull_request_reviews`), which is off here and
      # blocks the GITHUB_TOKEN actor from opening a PR at all:
      #
      #   release-please failed: GitHub Actions is not permitted to create or
      #   approve pull requests.
      #
      # An App token is a different actor and is not subject to that policy.
      # Enabling the policy instead would let *every* workflow in this repo
      # create and approve pull requests, including self-approval — a much
      # wider grant than this one job needs.
      - name: Generate Forge Bellows token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
