name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Pinned to a commit SHA: a mutable tag is a supply-chain seam. This job
        # only builds and tests, so it keeps no credential in .git/config either.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'

      - name: Install tmux
        # internal/tmux's *Isolated tests measure tmux's real -t target grammar
        # against a private socket — the only check that would catch a future
        # tmux restoring forgectl#237. They self-skip when tmux is absent, so
        # without this step they never ran here (#237 review).
        #
        # Bounded because this step does not fail when the apt mirror is
        # unreachable — it stops making progress. Observed wedging for 6 to 17
        # minutes on four occasions across two PRs, every following step
        # pending, while the macOS and helper jobs passed on the same head in
        # under a minute (forgectl#358). An unbounded hang leaves a PR with no
        # Linux signal at all and reads as "CI is slow"; a bounded one fails
        # fast and legibly, which is a state a re-run can actually clear. The
        # install normally completes in seconds, so this is generous.
        timeout-minutes: 3
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        # FORGECTL_REQUIRE_TMUX turns those tests' skips into failures: on a
        # runner where they are meant to run, a skip and a pass must not look
        # alike.
        env:
          FORGECTL_REQUIRE_TMUX: '1'
        run: go test ./...

      - name: Real-tmux grammar tests (named)
        # Same tests, -v: the run log naming each *Isolated test as PASS is the
        # readable proof they executed rather than skipped.
        env:
          FORGECTL_REQUIRE_TMUX: '1'
        run: go test -v -count=1 -run Isolated ./internal/tmux

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # .golangci.yml compares against origin/main. A shallow checkout can
          # make that ref absent and turn a new-findings gate into no gate.
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce generated changelog ownership
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: scripts/check-changelog-owner.sh

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.1

  macos-test:
    # Darwin-gated Go tests (runtime.GOOS skips) never execute on the ubuntu
    # job — this job exists so production wiring like the env clip client's
    # WithSensitive option is actually exercised in CI (#100). Build/Vet/gofmt
    # are platform-independent and stay ubuntu-only.
    #
    # Self-hosted: the M1 Max fleet's daemon tier, an isolated `ghr-forgectl`
    # account on a guest rebuilt nightly. Fork PRs need approval before any
    # workflow runs here (`all_external_contributors`), which is the control that
    # makes running a public repo's code on this host acceptable.
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'

      - name: Install tmux
        # Same reason as the ubuntu job: the *Isolated tmux-grammar tests skip
        # themselves without a tmux on PATH. Darwin is also where the socket-path
        # length constraint isolatedTmux works around actually bites.
        # `brew list ||` keeps the step reentrant: the runner image may already
        # ship tmux, and `brew install` over a present formula is not reliably
        # exit 0.
        #
        # Bounded for the same reason as the ubuntu job's. This one has not been
        # observed hanging, and it gets the bound anyway: a package install over
        # the network is the same shape of risk on either runner, and a bound
        # applied only where a hang has already been seen is one that arrives
        # after the outage rather than before it. Higher than ubuntu's because
        # brew genuinely can take longer when the formula is not in the image.
        timeout-minutes: 5
        run: brew list tmux || brew install tmux

      - name: Test (Darwin-gated coverage)
        # -v is deliberate: the run log naming each formerly-skipped test as
        # PASS is the proof this coverage exists. FORGECTL_REQUIRE_TMUX makes a
        # missing tmux a failure rather than a silent skip.
        env:
          FORGECTL_REQUIRE_TMUX: '1'
        run: go test -v ./...

  helper:
    # Same fleet as macos-test above. Swift comes from the guest's Xcode at
    # /usr/bin/swift, so this job needs nothing from Homebrew.
    runs-on: [self-hosted, macOS, ARM64]
    defaults:
      run:
        working-directory: helper/forgectl-bless-helper
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test
