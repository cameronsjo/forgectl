name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  goreleaser:
    # macOS, not ubuntu: the bless helper is a Swift package and needs an Apple
    # toolchain. The Go cross-build for linux/{amd64,arm64} still works from
    # here — every target is CGO_ENABLED=0.
    #
    # Self-hosted: the M1 Max fleet's `ghr-forgectl` account. Tag-triggered only,
    # so no fork-authored code reaches this job, and the signing certificate is
    # imported into an ephemeral keychain on a guest destroyed and rebuilt nightly.
    runs-on: [self-hosted, macOS, ARM64]
    permissions:
      contents: write
    env:
      # HAS_CERT selects Developer-ID signing over the ad-hoc fallback across the
      # job. It is derived from a secret (secrets aren't usable directly in a step
      # `if:`) and hoisted to JOB level so both the import step's `if:` and the
      # build step's `run:` read one source — no duplicated expression, and the
      # whole pipeline stays DORMANT until APPLE_CERTIFICATE_P12 is set.
      HAS_CERT: ${{ secrets.APPLE_CERTIFICATE_P12 != '' }}
    steps:
      - name: Checkout
        # This job handles signing material and write-scoped tokens, so every
        # third-party action is pinned to a reviewed immutable commit.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # GoReleaser authenticates through its explicit step environment;
          # no workflow token needs to remain in .git/config.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'

      # Import the Developer-ID signing certificate into an ephemeral keychain so
      # the helper and the darwin binaries can be Developer-ID signed. Gated on the
      # job-level HAS_CERT, so the whole pipeline stays DORMANT until
      # APPLE_CERTIFICATE_P12 is set: no cert, no import, and the build below falls
      # back to an ad-hoc signature. Lifted from cameronsjo/minute's release
      # workflow (a signed+notarized mac app) so the secret names match 1:1.
      - name: Import signing certificate
        if: env.HAS_CERT == 'true'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # errexit so a failed `security import` fails the step — without it the
          # trailing `rm -f` (always exit 0) would mask the failure and the build
          # would go green, then codesign later against an un-imported identity.
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$(security list-keychains -d user | tr -d '"')"

          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm -f "$RUNNER_TEMP/certificate.p12"

          # A Developer ID identity is only *valid* to codesign when its issuer
          # chain resolves. GitHub-hosted images ship Apple's intermediates in the
          # System keychain; a freshly provisioned self-hosted guest need not, and
          # then the import above succeeds while `codesign` later reports
          # "Developer ID Application: no identity found" (v0.17.0, the first
          # release on the fleet). Add the Developer ID G2 intermediate to the
          # ephemeral keychain, pinned by SHA-256 so a substituted download cannot
          # become a trusted issuer.
          CA_PATH="$RUNNER_TEMP/DeveloperIDG2CA.cer"
          curl -fsSL -o "$CA_PATH" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          echo "f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a  $CA_PATH" | shasum -a 256 -c -
          security add-certificates -k "$KEYCHAIN_PATH" "$CA_PATH"
          rm -f "$CA_PATH"

          # Fail here, not four steps later: assert the keychain holds a VALID
          # Developer ID Application identity. `find-identity` exits 0 whatever it
          # finds, so the assertion is a positive match on the identity name and
          # anything else — zero identities, an unexpected output shape, an empty
          # capture — fails closed. Diagnostics print only on failure.
          IDENTITIES="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH")"
          case "$IDENTITIES" in
            *"Developer ID Application"*) ;;
            *)
              echo "$IDENTITIES"
              security list-keychains -d user
              echo "::error::certificate imported but no valid Developer ID Application identity — issuer chain or keychain search list is wrong on this runner"
              exit 1 ;;
          esac

      # The helper reports the release version from its own `version` verb, so
      # stamp it from the tag before compiling. Mirrors the -X ldflags the Go
      # binary gets from goreleaser.
      - name: Stamp helper version
        working-directory: helper/forgectl-bless-helper
        run: |
          set -euo pipefail
          swift --version
          cat > Sources/BlessHelperCore/Version.swift <<EOF
          // This file is trivially regenerable: a later release PR overwrites it with the
          // version derived from the release tag. Keep it a single top-level constant.
          public let helperVersion = "${GITHUB_REF_NAME#v}"
          EOF
          cat Sources/BlessHelperCore/Version.swift

      # Build the helper universal (arm64 + x86_64) so one cask serves Apple
      # Silicon and Intel, ad-hoc sign it (a Secure Enclave key needs *a*
      # signature — a stable one is what binds the key to this binary), and
      # stage it where .goreleaser.yaml's darwin archive picks it up.
      - name: Build bless helper (universal)
        working-directory: helper/forgectl-bless-helper
        run: |
          set -euo pipefail
          swift build -c release --arch arm64 --arch x86_64
          BIN="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)/forgectl-bless-helper"
          # A Secure Enclave key needs *a* stable signature to bind to this binary.
          # With a cert present, use the real Developer-ID identity (hardened
          # runtime + secure timestamp) so Gatekeeper accepts it; otherwise keep
          # the ad-hoc signature that still satisfies the Secure Enclave.
          if [ "$HAS_CERT" = "true" ]; then
            codesign --sign "Developer ID Application" --options runtime --timestamp --force "$BIN"
          else
            codesign -s - -f "$BIN"
          fi
          mkdir -p "$GITHUB_WORKSPACE/dist-helper"
          cp "$BIN" "$GITHUB_WORKSPACE/dist-helper/forgectl-bless-helper"
          # Fail the release rather than quietly shipping a single-arch helper
          # to half the Mac users.
          ARCHS="$(lipo -archs "$GITHUB_WORKSPACE/dist-helper/forgectl-bless-helper")"
          echo "helper archs: $ARCHS"
          case " $ARCHS " in
            *" x86_64 "*) ;;
            *) echo "::error::bless helper is not universal (got: $ARCHS)"; exit 1 ;;
          esac
          case " $ARCHS " in
            *" arm64 "*) ;;
            *) echo "::error::bless helper is not universal (got: $ARCHS)"; exit 1 ;;
          esac
          codesign -dv "$GITHUB_WORKSPACE/dist-helper/forgectl-bless-helper"

      # Fail-closed guard for the armed helper-trust gate (forgectl#90): every
      # darwin release pins ExpectedTeamID=5H883FMW6H (.goreleaser.yaml), so the
      # shipped helper MUST satisfy that pin or EVERY user's blessing is rejected
      # (surfacing only at their Touch-ID prompt). A cert reissue under a different
      # team, or a silent ad-hoc signing fallback, would violate that invariant —
      # verify the built helper against the exact pin and fail the release on a
      # mismatch rather than shipping a bricked forgectl. Runs unconditionally: an
      # unsigned (HAS_CERT=false) build produces an ad-hoc helper that fails the
      # pin, which SHOULD block the release since forgectl ships armed regardless.
      # KEEP THIS TEAM ID IN SYNC with .goreleaser.yaml's ExpectedTeamID ldflag.
      - name: Verify signed helper satisfies the armed Team ID pin
        run: |
          set -euo pipefail
          codesign --verify --strict \
            -R '=anchor apple generic and certificate leaf[subject.OU] = "5H883FMW6H"' \
            "$GITHUB_WORKSPACE/dist-helper/forgectl-bless-helper"

      # The "Stamp helper version" step modifies the tracked Version.swift, which
      # leaves the tree dirty and makes GoReleaser abort its clean-state check.
      # The helper binary already embeds the stamped version (it's compiled in
      # above), so the source file's job is done — restore it to clean the tree.
      - name: Restore stamped version (clean tree for goreleaser)
        run: git checkout -- helper/forgectl-bless-helper/Sources/BlessHelperCore/Version.swift

      # Mint a short-lived token scoped to the tap repo via the GitHub App
      # (RELEASE_APP_ID / RELEASE_APP_PRIVATE_KEY), instead of a long-lived PAT.
      # GoReleaser uses the default GITHUB_TOKEN for the forgectl release and
      # this app token only for the cross-repo cask push.
      - name: Mint tap token
        id: tap-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # client-id, not the deprecated app-id. The action resolves
          # `getInput("client-id") || getInput("app-id")` into a single value it
          # passes as createAppAuth's appId, so the numeric App ID in
          # RELEASE_APP_ID stays valid under the new key — this is a rename, not
          # a credential change.
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: homebrew-tap
          permission-contents: write

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # App-minted, tap-scoped, short-lived — read by the homebrew_casks block.
          HOMEBREW_TAP_TOKEN: ${{ steps.tap-token.outputs.token }}
          # Arms the darwin build's post-hook codesign. A SECRET (following
          # cameronsjo/minute), empty until set, so the hook is a no-op until then.
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # The ephemeral keychain holds the Developer ID private key with a partition
      # list that lets codesign use it unattended. Delete it whether or not the
      # release succeeded, rather than leaving it in $RUNNER_TEMP until the next
      # job start clears it. Guarded on HAS_CERT: with no cert there is no keychain.
      - name: Delete signing keychain
        if: always() && env.HAS_CERT == 'true'
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
